# CADRE Phase 1 gateway: active external inference stays on OpenRouter's free router.
# Local and premium lanes remain deliberately disabled until their runtimes, keys,
# economics, and authority are explicitly approved.
model_list:
  - model_name: cadre-free
    litellm_params:
      model: os.environ/CADRE_OPENROUTER_MODEL
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: os.environ/OPENROUTER_API_BASE
      rpm: 5
      max_parallel_requests: 2
      timeout: 60

  # Future local-first lane. Enable only after a local runtime is installed and verified.
  # - model_name: cadre-local
  #   litellm_params:
  #     model: os.environ/CADRE_LOCAL_MODEL
  #     api_base: os.environ/CADRE_LOCAL_API_BASE
  #     api_key: os.environ/CADRE_LOCAL_API_KEY
  #     timeout: 15

  # Future premium lane. Enable only after explicit provider and spending approval.
  # - model_name: cadre-premium
  #   litellm_params:
  #     model: os.environ/CADRE_PREMIUM_MODEL
  #     api_key: os.environ/CADRE_PREMIUM_API_KEY
  #     timeout: 60

router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
  num_retries: 1
  retry_after: 1
  timeout: 90
  allowed_fails: 1
  cooldown_time: 30

  # Activate only when both referenced lanes are configured and authorized.
  # fallbacks:
  #   - cadre-local: [cadre-free]
  #   - cadre-free: [cadre-premium]

litellm_settings:
  drop_params: true
  request_timeout: 90
  telemetry: false
  turn_off_message_logging: true
  redact_messages_in_exceptions: true

general_settings:
  master_key: os.environ/CADRE_AI_GATEWAY_API_KEY
  store_model_in_db: false
  background_health_checks: false
  health_check_details: false
  disable_spend_logs: true
  disable_error_logs: true

# Do not add max_budget without a LiteLLM PostgreSQL database. In DB-less mode that
# control fails open. Phase 1's enforceable dollar ceiling belongs on the OpenRouter key.
