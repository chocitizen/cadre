services:
  db:
    image: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_DB: cadre
      POSTGRES_USER: cadre
      POSTGRES_PASSWORD: ${CADRE_DB_PASSWORD:?CADRE_DB_PASSWORD is required}
    volumes:
      - cadre_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadre -d cadre"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      CADRE_ENV: ${CADRE_ENV:-development}
      CADRE_APP_NAME: ${CADRE_APP_NAME:-LANSEIR}
      CADRE_DATABASE_URL: ${CADRE_DATABASE_URL:?CADRE_DATABASE_URL is required}
      CADRE_OPERATIONS_STATE_PATH: ${CADRE_OPERATIONS_STATE_PATH:-/tmp/lanseir-mission-control.json}
      CADRE_RELEASE_ID: ${CADRE_RELEASE_ID:-development}
      CADRE_API_TOKENS_JSON: ${CADRE_API_TOKENS_JSON:?CADRE_API_TOKENS_JSON is required}
      CADRE_PUBLIC_URL: ${CADRE_PUBLIC_URL:-http://127.0.0.1:8000}
      CADRE_ADMIN_EMAILS: ${CADRE_ADMIN_EMAILS:-}
      CADRE_EXPOSE_DEVELOPMENT_TOKENS: ${CADRE_EXPOSE_DEVELOPMENT_TOKENS:-false}
      CADRE_AI_PROVIDER: ${CADRE_AI_PROVIDER:-local}
      CADRE_AI_MODEL: ${CADRE_AI_MODEL:-lanseir-reflection-v1}
      CADRE_AI_BASE_URL: ${CADRE_AI_BASE_URL:-https://litellm.internal/v1}
      CADRE_AI_API_KEY: ${CADRE_AI_API_KEY:-}
      CADRE_AI_DAILY_MESSAGE_LIMIT: ${CADRE_AI_DAILY_MESSAGE_LIMIT:-40}
      CADRE_AUTH_RATE_LIMIT_PER_MINUTE: ${CADRE_AUTH_RATE_LIMIT_PER_MINUTE:-20}
      CADRE_REQUEST_TIMEOUT_SECONDS: ${CADRE_REQUEST_TIMEOUT_SECONDS:-30}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  cadre_postgres:
